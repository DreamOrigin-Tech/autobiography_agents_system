services:
  backend:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${BACKEND_PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        PIP_TRUSTED_HOST: ${BACKEND_PIP_TRUSTED_HOST:-mirrors.aliyun.com}
    ports:
      - "6986:6986"
    env_file:
      - ./backend/.env
    environment:
      - DEV_AUTH_BYPASS=${DEV_AUTH_BYPASS:-false}
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 6986 --reload

  frontend:
    build: ./frontend
    ports:
      - "6985:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:6986/api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: npm run dev -- -p 3000 -H 0.0.0.0
    depends_on:
      - backend

volumes:
  frontend_node_modules:
  frontend_next:
