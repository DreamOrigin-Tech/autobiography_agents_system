services:
  backend:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${BACKEND_PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        PIP_TRUSTED_HOST: ${BACKEND_PIP_TRUSTED_HOST:-mirrors.aliyun.com}
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/autobiography.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://jiumozhi.tech:6985}
      DEV_AUTH_BYPASS: "false"
    command: uvicorn app.main:app --host 0.0.0.0 --port 6986 --workers 2
    ports:
      - "6986:6986"
    volumes:
      - backend_data:/data
    networks:
      - web

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://jiumozhi.tech:6986/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://jiumozhi.tech:6985}
        NEXT_PUBLIC_DEV_AUTH_BYPASS: "false"
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "6985:3000"
    networks:
      - web

volumes:
  backend_data:

networks:
  web:
